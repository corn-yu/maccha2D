<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゲーム</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="hud">
    <span>スコア<b id="score">0</b></span>
    <span id="timeWrap">のこり<b id="time">0</b></span>
    <span>ベスト<b id="best">0</b></span>
  </div>

  <div id="stage">
    <canvas id="canvas"></canvas>

    <section class="screen" id="startScreen">
      <h1 id="title"></h1>
      <p id="tagline"></p>
      <button id="startBtn" type="button">スタート</button>
      <p id="howto"></p>
    </section>

    <section class="screen" id="resultScreen" hidden>
      <p id="resultMsg">おつかれさま！</p>
      <div class="big" id="finalScore">0</div>
      <p id="bestMsg"></p>
      <button id="retryBtn" type="button">もう一度</button>
    </section>
  </div>
</div>

<!-- 読み込む順番は game.js → shell.js のまま変えないでください -->
<script src="game.js"></script>
<script src="shell.js"></script>
</body>
</html>
