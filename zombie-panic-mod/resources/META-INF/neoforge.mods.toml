[[mods]]
modId = "zombiepanic"
version = "2.6.0"
displayName = "ゾンビパニック"
authors = "まっちゃ"
description = '''
ゾンビの呪いに おおわれた、明けない夜の世界。どのディメンションでも ゾンビしか わかず、ずっと出つづける。
10体に1体は特殊能力、100体に1体は強い能力、1000体に1体は「災厄」。レアなほど体も強く、能力を いくつも持つ。
300体たおすごとにボスが出て、18種類のパニックが ときどき起きる。
元の構造物はなく、廃都市と研究所で「世界の真実」と呪鉄を手に入れよう。
エンドのゾンビドラゴンをたおすと 呪いがとけて クリア！
'''

