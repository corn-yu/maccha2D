<title>こえまほう 魔法パズル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  /* レイアウト: 画面1枚に全部。左の大きな作業台に ピースのかたまりを自由に置き、詠唱から効果へ線でつなぐ。右に ピース箱・じゅもん.txt */
  :root {
    --bg: #f1eef8;
    --panel: #ffffff;
    --ink: #231d35;
    --muted: #6c6486;
    --line: #dbd3ec;
    --accent: #7b3fe4;
    --accent-ink: #ffffff;
    --code-bg: #faf8ff;
    --ok: #1f8a4c;
    --shadow: rgba(35, 29, 53, 0.18);
    --c-place: #2f8fd8; --c-control: #d4a017; --c-attack: #e0533d; --c-move: #e8862b;
    --c-friend: #2fa86a; --c-summon: #9c6b2c; --c-look: #5a58d6; --c-big: #8a3fd1;
    --c-build: #4f7f8f; --c-name: #6b4bd6; --c-chant: #c04fd1;
    --font-display: "DotGothic16", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    --font-code: ui-monospace, "BIZ UDGothic", "MS Gothic", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15121f; --panel: #1f1a2e; --ink: #ece8f7; --muted: #a59dbd; --line: #3a3252;
      --accent: #a77bff; --accent-ink: #15121f; --code-bg: #1a1627; --ok: #5fd28f; --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15121f; --panel: #1f1a2e; --ink: #ece8f7; --muted: #a59dbd; --line: #3a3252;
    --accent: #a77bff; --accent-ink: #15121f; --code-bg: #1a1627; --ok: #5fd28f; --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 10px; height: 100vh; height: 100dvh; box-sizing: border-box; overflow: hidden;
  }
  .page { height: 100%; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; margin: 0; letter-spacing: 0.04em; }
  header p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .bench { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 240px; grid-template-rows: minmax(0, 1fr); gap: 10px; }
  .fit-box { position: relative; overflow: auto; min-width: 0; min-height: 0; }
  .fit { position: relative; }
  /* 作業台は 動かせる・大きさを変えられる 台の上 */
  #boardBox { overflow: hidden; cursor: default; }
  #boardBox.panning { cursor: grabbing; }
  #board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .zoom { color: var(--muted); font-size: 0.8rem; }
  .side .fit { display: flex; flex-direction: column; gap: 8px; }
  .side .card { padding: 10px; gap: 6px; }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; margin: 0; }
  .hint { color: var(--muted); font-size: 0.85rem; margin: 0; line-height: 1.6; }
  button {
    font-family: var(--font-body); font-weight: 700; font-size: 0.9rem; border-radius: 999px; padding: 6px 14px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  }
  button.quiet { background: transparent; color: var(--accent); }
  button.small { padding: 3px 10px; font-size: 0.8rem; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .piece:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  input[type="text"], input[type="number"], select {
    font-family: var(--font-body); font-size: 0.95rem; color: var(--ink); background: var(--code-bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; min-width: 0;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* 作業台の上の かたまりと線 */
  .board-card { height: 100%; box-sizing: border-box; }
  #boardBox { background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 18px 18px; border-radius: 8px; }
  #wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #wires .wire { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
  #wires .wire.drawing { stroke-dasharray: 8 6; }
  #wires .wire-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
  #wires .wire-hit:hover { stroke: color-mix(in srgb, #e0533d 35%, transparent); }
  .group { position: absolute; }
  .group.moving { opacity: 0.8; }
  .grip { position: absolute; left: 0; top: 0; height: 18px; padding: 0 8px; border-radius: 6px; font-size: 0.8rem; line-height: 18px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); cursor: grab; user-select: none; touch-action: none; }
  .grip:active { cursor: grabbing; }
  .port { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--panel); border: 3px solid var(--accent); box-sizing: border-box; }
  .port.out { cursor: crosshair; touch-action: none; }
  .port.out:hover { background: var(--accent); }
  .jig.ghost { opacity: 0.45; }
  .jig.ghost:hover, .jig.ghost:focus-visible { opacity: 0.8; }
  .jig.ghost svg path { stroke-dasharray: 6 4; }

  /* パズル：ピースは SVG の形の上に 文字や入力をのせる */
  .jig { position: absolute; cursor: pointer; }
  .jig svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .jig svg path { fill: var(--c); stroke: rgba(0, 0, 0, 0.25); stroke-width: 1.5; }
  .jig .body { position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 2px; color: #fff; padding: 0 12px 0 16px; box-sizing: border-box; }
  .jig .title { font-weight: 900; font-size: 0.8rem; line-height: 1.2; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.25); }
  .jig .vals { font-size: 0.72rem; line-height: 1.35; opacity: 0.95; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .jig input { width: 100%; box-sizing: border-box; background: rgba(255, 255, 255, 0.92); color: #231d35; border: none; border-radius: 5px; padding: 2px 6px; font-size: 0.78rem; }
  .jig .args-on { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 5px; }
  .jig .arg-on { display: flex; align-items: center; gap: 3px; font-size: 0.64rem; font-weight: 700; min-width: 0; }
  .jig .arg-on span { white-space: nowrap; }
  .jig .arg-on select, .jig .arg-on input { flex: 1; min-width: 0; width: 100%; box-sizing: border-box; background: rgba(255, 255, 255, 0.92); color: #231d35;
    border: none; border-radius: 4px; padding: 1px 3px; font-size: 0.72rem; font-family: var(--font-body); height: 19px; }
  .jig .x.copy { right: 34px; }
  .jig select.kind { align-self: flex-start; max-width: calc(100% - 48px); font-family: var(--font-body); font-weight: 900; font-size: 0.78rem; color: #fff;
    background: rgba(0, 0, 0, 0.22); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 5px; padding: 0 2px; height: 20px; }
  .jig select.kind option, .jig select.kind optgroup { color: #231d35; background: #fff; }
  .jig .x { position: absolute; top: 4px; right: 12px; z-index: 1; background: rgba(0, 0, 0, 0.25); color: #fff; border: none; border-radius: 999px; padding: 0 5px; font-size: 0.62rem; line-height: 1.4; }
  .jig.selected svg path { stroke: var(--ink); stroke-width: 3.5; }
  .jig.dragging { opacity: 0.4; }
  .jig.drop-here svg path { stroke: var(--accent); stroke-width: 4; stroke-dasharray: 6 4; }
  .jig .loop { position: absolute; left: 4px; top: 8px; bottom: 8px; width: 4px; border-radius: 3px; background: #ffd23c; }
  .column-label { position: absolute; font-family: var(--font-display); color: var(--muted); font-size: 0.85rem; }
  .shelf-piece { position: relative; display: inline-flex; align-items: center; height: 40px; padding: 0 16px 0 20px; margin: 10px 18px 10px 0; color: #fff;
    border: none; background: transparent; font-family: var(--font-body); font-weight: 900; font-size: 0.9rem; cursor: pointer; }
  .shelf-piece svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .shelf-piece svg path { fill: var(--c); stroke: rgba(0, 0, 0, 0.2); }
  .shelf-piece span { position: relative; }
  .jig:focus-visible, .shelf-piece:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }

  /* えらんだピースの くわしい設定 */
  .detail { border-left: 6px solid var(--c, var(--accent)); }
  .args { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .arg { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .arg label { font-weight: 700; }
  .arg .help { color: var(--muted); font-size: 0.72rem; line-height: 1.4; }
  .arg .pair { display: flex; gap: 8px; align-items: center; }
  .arg input[type="range"] { flex: 1; min-width: 0; accent-color: var(--c, var(--accent)); }
  .arg input[type="number"] { width: 5.5em; }

  /* ピース箱 */
  .shelf { display: flex; flex-direction: column; gap: 3px; }
  .shelf h3 { margin: 0 6px 5px 0; font-size: 0.72rem; color: var(--muted); width: 4.6em; line-height: 1.2; }
  .shelf .row { gap: 0; }

  textarea {
    width: 100%; box-sizing: border-box; min-height: 260px; resize: vertical; font-family: var(--font-code); font-size: 12.5px;
    background: var(--code-bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; line-height: 1.55;
  }
  #status { color: var(--ok); font-size: 0.85rem; min-height: 1.2em; }
  .note code { font-family: var(--font-code); font-size: 0.78rem; word-break: break-all; }
  details summary { cursor: pointer; font-weight: 700; }
  #output { min-height: 0; height: 70px; }
  /* せまい画面（スマホ）では 縮めずに ふつうにスクロール */
  @media (max-width: 860px) {
    body { height: auto; overflow: visible; }
    .page { height: auto; }
    .bench { flex: none; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
    .board-card { height: auto; }
    .fit-box { overflow-x: auto; }
    .side .fit { position: static; }
    .side .fit { width: auto; }
    #boardBox { height: 70vh; flex: none !important; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="page">
  <header>
    <h1>こえまほう 魔法パズル</h1>
    <p>詠唱（上から言う）の ● から 効果（上から動く）へ線をひくと魔法になる。1つの効果に詠唱いくつでも、1つの詠唱から効果いくつでも。線を押すと消える</p>
  </header>

  <div class="bench">
    <section class="card board-card" aria-label="魔法の作業台">
      <div class="row" style="justify-content: space-between">
        <h2>魔法の作業台</h2>
        <div class="row">
          <span class="zoom" id="zoomText">100%</span>
          <span class="hint">Ctrl＋ホイールで大きさ・ホイールを押してドラッグで移動</span>
          <button id="resetView" type="button" class="small quiet">もとにもどす</button>
        </div>
      </div>
      <div class="fit-box" id="boardBox" style="flex: 1">
        <div class="fit" id="board"></div>
      </div>
    </section>

    <div class="fit-box side" id="sideBox">
      <div class="fit" id="side">
        <section class="card" aria-label="ピース箱">
          <h2>ピース箱</h2>
          <div class="shelf" id="shelf"></div>
        </section>
        <section class="card">
          <h2>できた じゅもん.txt</h2>
          <textarea id="output" readonly spellcheck="false" aria-label="できた文"></textarea>
          <div class="row">
            <button id="copy" type="button" class="small">ぜんぶコピー</button>
            <span id="status" role="status"></span>
          </div>
          <p class="hint note">コピーして <code>.minecraft\installations\iroiro\config\koemahou\じゅもん.txt</code> にはりつけて保存</p>
          <details id="importBox">
            <summary>じゅもん.txt を読みこむ</summary>
            <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px">
              <textarea id="importText" spellcheck="false" style="min-height: 0; height: 90px" placeholder="じゅもん.txt の中身をはりつけて…" aria-label="読みこむ文"></textarea>
              <button id="importBtn" type="button" class="small quiet">パズルにする</button>
            </div>
          </details>
        </section>
      </div>
    </div>
  </div>
</div>

<script>
// ================= えらべる名前（MOD の MagicRunner.java と同じ） =================
const PARTICLES = ["炎", "青い炎", "煙", "大きな煙", "闇", "ポータル", "逆ポータル", "光", "ハート", "緑", "電気", "魔法",
  "溶岩", "爆発", "大爆発", "雪", "泡", "トーテム", "灰", "衝撃波", "水", "音符", "怒り", "クリティカル", "星", "雲", "ドラゴン", "魂", "毒"];
const SOUNDS = ["爆発", "雷", "ベル", "レベルアップ", "トーテム", "ワープ", "ブレイズ", "ウォーデン", "ビーコン", "キラキラ",
  "ドラゴン", "ウィザー", "ポータル", "火", "風", "ガラス"];
const POTIONS = ["再生", "衝撃吸収", "耐性", "力", "スピード", "跳躍", "透明", "暗視", "発光", "鈍足", "弱体化", "毒", "盲目",
  "浮遊", "低速落下", "火炎耐性", "水中呼吸", "採掘速度上昇", "ウィザー", "暗闇"];
const SHOTS = ["火の玉", "大きな火の玉", "ウィザーの頭", "ドラゴンの火の玉", "矢", "雪玉", "風の弾", "シュルカーの弾", "TNT"];
const MOBS = ["オオカミ", "アイアンゴーレム", "スノーゴーレム", "ネコ", "ミツバチ", "アレイ", "ヴェックス", "ゾンビ", "スケルトン",
  "クリーパー", "ブタ", "ニワトリ", "ウシ", "ヒツジ", "キツネ", "コウモリ", "エヴォーカーの牙"];
const PLACES = ["見ている所", "自分", "上", "前", "まわり", "もどる", "近くのモブ", "ランダムなモブ"];
const BLOCKS = ["氷", "青い氷", "ガラス", "石", "黒曜石", "光る石", "雪", "クモの巣", "葉っぱ", "金", "ダイヤ", "土", "マグマ", "木", "スライム", "アメジスト"];
const DIRECTIONS = ["見ている方", "上", "下", "前", "うしろ", "右", "左", "ランダム", "場所の方", "自分の方", "近くのモブの方", "横にまわす", "縦にまわす"];

// ================= ピースの形 =================
// 数: [名前, はじめ, いちばん小さい, いちばん大きい, きざみ, 説明]   言葉: [名前, 一覧, 説明]
const n = (name, def, min, max, step, help) => ({ name, kind: "num", def, min, max, step, help });
const w = (name, list, help) => ({ name, kind: "word", def: list[0], list, help });

const SECONDS = "何秒";
const PIECES = [
  { part: "場所", cat: "place", group: "場所・向き", args: [w("どこ", PLACES, "見ている所＝見ているブロック／自分＝足もと／上・前＝今の場所から動かす／まわり＝近くのランダムな所／もどる＝見ている所か自分にもどる／近くのモブ・ランダムなモブ＝モブのいる所"),
      n("距離", 20, 0, 64, 1, "見ている所：どこまで届くか／上・前：何ブロック動かすか（マイナスで反対）／まわり：半径／モブ：さがす広さ")] },
  { part: "向き", cat: "place", group: "場所・向き", args: [w("どっち", DIRECTIONS, "撃つ・ビーム・押す・ワープ・場所の「前」が この向きを使う。まわす＝今の向きを角度ぶん回す"),
      n("角度", 90, -180, 180, 5, "横にまわす・縦にまわす のときだけ。プラスで右／上")] },
  { part: "待つ", cat: "control", group: "時間", args: [n("秒", 1, 0, 10, 0.1, "次のピースまで待つ時間")] },
  { part: "くりかえす", cat: "control", group: "時間", args: [n("回数", 10, 1, 200, 1, "「ここまで」までのピースを何回くりかえすか"),
      n("間隔", 0.1, 0, 5, 0.05, "1回ごとに何秒あけるか")] },
  { part: "ここまで", cat: "control", group: "時間", args: [] },
  { part: "待ち時間", cat: "control", group: "時間", args: [n("秒", 10, 0, 120, 1, "この魔法をもう一度使えるまでの時間")] },
  { part: "爆発", cat: "attack", group: "こうげき", args: [n("大きさ", 4, 1, 12, 0.5, "TNT が 4。ブロックはこわれない。自分と仲間には当たらない")] },
  { part: "ダメージ", cat: "attack", group: "こうげき", args: [n("量", 10, 1, 100, 1, "2 でハート1こぶん"), n("半径", 4, 0, 48, 1, "今の場所から何ブロックまでのモブに")] },
  { part: "燃やす", cat: "attack", group: "こうげき", args: [n("秒", 5, 1, 30, 1, "何秒 燃えるか"), n("半径", 4, 0, 48, 1, "今の場所から何ブロックまでのモブを")] },
  { part: "雷", cat: "attack", group: "こうげき", args: [n("本数", 1, 1, 30, 1, "何本 落とすか（見た目。ダメージはダメージのピースで）"), n("半径", 0, 0, 48, 1, "0 なら今の場所、数字ならそのまわりにばらばら")] },
  { part: "ビーム", cat: "attack", group: "こうげき", args: [w("種類", PARTICLES, "光線の見た目"), n("長さ", 20, 1, 64, 1, "何ブロック先まで"), n("ダメージ", 10, 0, 100, 1, "光線に当たったモブへ（2 でハート1こ）")] },
  { part: "吸いこむ", cat: "move", group: "うごかす", args: [n("半径", 15, 1, 48, 1, "何ブロックまでのモブを"), n("秒", 3, 0.05, 30, 0.05, "何秒 吸いつづけるか"), n("強さ", 1, 0.1, 5, 0.1, "1 がふつう")] },
  { part: "吹きとばす", cat: "move", group: "うごかす", args: [n("半径", 8, 1, 48, 1, "何ブロックまでのモブを"), n("強さ", 2, 0.5, 10, 0.5, "外へ飛ばす強さ")] },
  { part: "押す", cat: "move", group: "うごかす", args: [n("半径", 8, 1, 48, 1, "何ブロックまでのモブを"), n("強さ", 2, 0.5, 10, 0.5, "今の向きへ押す強さ")] },
  { part: "うかせる", cat: "move", group: "うごかす", args: [n("半径", 8, 1, 48, 1, "何ブロックまでのモブを"), n("秒", 3, 0.5, 30, 0.5, "何秒 うかせるか"), n("高さ", 4, 1, 30, 1, "何ブロックの高さに")] },
  { part: "止める", cat: "move", group: "うごかす", args: [n("半径", 10, 1, 48, 1, "何ブロックまでのモブの時間を"), n("秒", 5, 0.5, 30, 0.5, "何秒 止めるか")] },
  { part: "回復", cat: "friend", group: "自分・仲間", args: [n("量", 8, 1, 40, 1, "2 でハート1こぶん"), n("半径", 0, 0, 48, 1, "0 なら自分だけ。数字なら近くのプレイヤーも")] },
  { part: "効果", cat: "friend", group: "自分・仲間", args: [w("名前", POTIONS, "ポーションの効果"), n("秒", 10, 1, 600, 1, "何秒 つづくか"), n("レベル", 1, 1, 10, 1, "1 がふつう"),
      w("だれ", ["自分", "仲間", "モブ"], "だれにかけるか"), n("半径", 8, 0, 48, 1, "仲間・モブのとき、何ブロックまで")] },

/** ピースを1つ作る（はじめの数字で） */
function newPiece(part) {

  for (const arg of SPEC[part].args) args[arg.name] = arg.def;
  return { part, args };
}

/** 1行の数字を、きれいな文字にする */
function numText(value) {
  return String(Math.round(Number(value) * 100) / 100);
}


/** じゅもん.txt の文を読んで、データにする（知らない行は とばす） */
function readText(text) {
  const result = [];
  let spell = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || line.startsWith("#")) continue;
    const head = line.match(/^\[(.*?)\]\s*(.*)$/);
    if (head) {
      spell = { name: head[1].trim(), chants: [], pieces: [] };
      if (head[2] && SPEC[head[2]]) spell.pieces.push(newPiece(head[2]));
      result.push(spell);
      continue;
    }
    if (!spell) continue;
    if (!(line.startsWith("＞") || line.startsWith(">"))) {
      spell.chants.push(line);
      continue;
    }
    const words = line.slice(1).replace(/　/g, " ").replace(/＝/g, "=").trim().split(/\s+/);
    const spec = SPEC[words[0]];
    if (!spec) continue;
    const piece = newPiece(words[0]);
    let next = 0;
    for (const word of words.slice(1)) {
      const equal = word.indexOf("=");
      let arg = null, value = word;
      if (equal > 0) {
        arg = spec.args.find(item => item.name === word.slice(0, equal));
        value = word.slice(equal + 1);
      } else {
        arg = spec.args[next++];
      }
      if (!arg) continue;
      if (arg.kind === "num") {
        const number = Number(value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^0-9.\-]/g, ""));
        if (Number.isFinite(number)) piece.args[arg.name] = number;
      } else if (arg.kind === "text" || arg.list.includes(value)) {
        piece.args[arg.name] = value;
      }
    }
    spell.pieces.push(piece);
  }
  return result;
}


// ================= パズルの形 =================
const KNOB = 8;        // 出っぱりの丸の半径
const NECK = 5;        // 出っぱりの首の半分の幅

/** 1つの辺を描く（from から to へ。kind: "flat" 平ら / "tab" 外へ出っぱり / "hole" 内へへこみ） */
function edge(fromX, fromY, toX, toY, kind) {
  if (kind === "flat") return `L ${toX} ${toY} `;
  const length = Math.hypot(toX - fromX, toY - fromY);
  const ux = (toX - fromX) / length, uy = (toY - fromY) / length;
  // 外がわ（時計まわりに描くので、進む向きの左が外）
  const out = kind === "tab" ? -1 : 1;
  const nx = uy * out, ny = -ux * out;
  const mid = length / 2;
  const p = (along, away) => `${(fromX + ux * along + nx * away).toFixed(1)} ${(fromY + uy * along + ny * away).toFixed(1)}`;
  return `L ${p(mid - NECK, 0)} L ${p(mid - NECK, 2)} A ${KNOB} ${KNOB} 0 1 ${kind === "tab" ? 1 : 0} ${p(mid + NECK, 2)} L ${p(mid + NECK, 0)} L ${toX} ${toY} `;
}

/** ピースの形（幅 width・高さ height の本体と、上右下左の出っぱり・へこみ）の SVG パス */
function jigsawPath(width, height, sides) {
  const [top, right, bottom, left] = sides;
  return `M 0 0 ` + edge(0, 0, width, 0, top) + edge(width, 0, width, height, right)
    + edge(width, height, 0, height, bottom) + edge(0, height, 0, 0, left) + "Z";
}

/** SVG の形を作る */
function shapeSvg(width, height, sides) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", jigsawPath(width, height, sides));
  svg.append(path);
  return svg;
}


/** 効果ピースの高さ（設定の数で のびる。2つずつ ならぶ） */
function pieceHeight(piece) {
  const count = SPEC[piece.part].args.length;
  return Math.max(SIZE.h, 24 + Math.ceil(count / 2) * 21 + 4);
}

/** 効果ピースの上に置く 設定（種類はえらぶ、数字は書く） */
function argControls(piece) {
  const box = document.createElement("div");
  box.className = "args-on";
  SPEC[piece.part].args.forEach(arg => {
    const field = document.createElement("label");
    field.className = "arg-on";
    if (arg.help) field.title = arg.help;
    const name = document.createElement("span");
    name.textContent = arg.name;
    field.append(name);
    let control;
    if (arg.kind === "word") {
      control = document.createElement("select");
      for (const option of arg.list) control.append(new Option(option, option));
      control.value = piece.args[arg.name];
      control.addEventListener("change", () => { piece.args[arg.name] = control.value; save(); });
    } else if (arg.kind === "text") {
      control = document.createElement("input");
      control.type = "text";
      control.value = piece.args[arg.name];
      control.addEventListener("input", () => { piece.args[arg.name] = control.value; save(); });
    } else {
      control = document.createElement("input");
      control.type = "number";
      control.min = arg.min; control.max = arg.max; control.step = arg.step;
      control.value = piece.args[arg.name];
      control.addEventListener("input", () => { if (control.value !== "" && Number.isFinite(Number(control.value))) { piece.args[arg.name] = Number(control.value); save(); } });
    }
    field.append(control);
    box.append(field);
  });
  return box;
}


/** ピースの入れものを作る（root の中に SVG の形と body） */
function makeJig(x, y, width, height, sides, cat) {
  const pad = KNOB * 2 + 2;
  const root = document.createElement("div");
  root.className = "jig";
  root.style.setProperty("--c", `var(--c-${cat})`);
  root.style.left = `${x}px`;
  root.style.top = `${y}px`;
  root.style.width = `${width}px`;
  root.style.height = `${height}px`;
  const svg = shapeSvg(width, height, sides);
  root.append(svg);
  const body = document.createElement("div");
  body.className = "body";
  body.style.inset = "0";
  root.append(body);
  void pad;
  return { root, body };
}

/** ピースの見出しの文字 */
function titleSpan(text) {
  const span = document.createElement("span");
  span.className = "title";
  span.textContent = text;
  return span;
}

/** ピースの右上の ✕ ボタン */
function closeButton(label, action) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "x";
  button.textContent = "✕";
  button.setAttribute("aria-label", label);
  button.addEventListener("click", event => { event.stopPropagation(); action(); });
  return button;
}

/** ドラッグできるようにする（data は運ぶもの、onDrop は ここに落とされたとき） */
function dragSetup(element, data, onDrop) {
  element.draggable = true;
  // 入力やボタンをさわるときは ドラッグしない（文字をえらべるように）
  element.addEventListener("pointerdown", event => { element.draggable = !event.target.closest("input, select, button"); });
  element.addEventListener("dragstart", event => { event.dataTransfer.setData("text/plain", data); element.classList.add("dragging"); });
  element.addEventListener("dragend", () => element.classList.remove("dragging"));
  element.addEventListener("dragover", event => { event.preventDefault(); element.classList.add("drop-here"); });
  element.addEventListener("dragleave", () => element.classList.remove("drop-here"));
  element.addEventListener("drop", event => { event.preventDefault(); event.stopPropagation(); onDrop(event.dataTransfer.getData("text/plain")); });
}


// ================= 作業台（データ） =================
// かたまり: { id, kind: "chant" か "effect", x, y, name（詠唱だけ）, items（詠唱の文 か 効果ピース） }
// 線: { from: 詠唱のかたまりの id, to: 効果のかたまりの id }
let groups = [];
let links = [];
let nextId = 1;
// えらんでいるピース（ピース箱のピースが ここにつながる）
let selected = null;

// ピースの大きさ
const SIZE = { nameW: 100, chantW: 140, effectW: 220, h: 46 };
const GRIP = 26;          // かたまりの上の つかむところ
const FIRST_EFFECT = "爆発";

/** id から かたまりをさがす */
function groupById(id) {
  return groups.find(group => group.id === id);
}

/** かたまりを作って 作業台にのせる */
function makeGroup(kind, x, y, items, name = "") {
  const group = { id: nextId++, kind, x: Math.round(x), y: Math.round(y), items };
  if (kind === "chant") group.name = name;
  groups.push(group);
  return group;
}

/** 詠唱のかたまりの 高さ（「＋」のピースもふくむ） */
function chantHeight(group) {
  return Math.max(group.items.length, 1) * SIZE.h;
}

/** 効果のかたまりの 高さ */
function effectHeight(group) {
  return group.items.reduce((sum, piece) => sum + pieceHeight(piece), 0);
}

/** 詠唱のかたまりの 線が出るところ（作業台の上の場所） */
function portOut(group) {
  return { x: group.x + SIZE.nameW + SIZE.chantW + 18, y: group.y + GRIP + Math.max(group.items.length, 1) * SIZE.h / 2 };
}

/** 効果のかたまりの 線が入るところ */
function portIn(group) {
  return { x: group.x - 16, y: group.y + GRIP + SIZE.h / 2 };
}

/** かたまりと、そこへの線を消す */
function removeGroup(id) {
  groups = groups.filter(group => group.id !== id);
  links = links.filter(link => link.from !== id && link.to !== id);
  if (selected?.group === id) selected = null;
}

/** 空になった効果のかたまりを かたづける */
function cleanEmpty() {
  for (const group of [...groups]) if (group.kind === "effect" && group.items.length === 0) removeGroup(group.id);
}

// ================= じゅもん.txt ⇄ データ =================
/** 効果ピースの ならびを「＞」の行にする（くりかえすが とじていなければ さいごに とじる） */
function pieceLines(pieces) {
  const out = [];
  let depth = 0;
  for (const piece of pieces) {
    if (piece.part === "ここまで") depth = Math.max(0, depth - 1);
    const words = [piece.part, ...SPEC[piece.part].args.map(arg =>
      `${arg.name}=${arg.kind === "num" ? numText(piece.args[arg.name]) : String(piece.args[arg.name]).replace(/\s+/g, "_")}`)];
    out.push(`＞${"  ".repeat(depth)}${words.join(" ")}`);
    if (piece.part === "くりかえす") depth++;
  }
  while (depth-- > 0) out.push(`＞${"  ".repeat(depth)}ここまで`);
  return out;
}

/** 作業台を じゅもん.txt の文にする（詠唱のかたまり1つが 魔法1つ。つながった効果を上から順に ぜんぶ動かす） */
function makeText() {
  const out = ["# じゅもん表 v5", "# 魔法パズルで作りました", ""];
  const usedNames = new Set();
  const lonely = [];
  // 上にあるものから順に
  const chants = groups.filter(group => group.kind === "chant").sort((a, b) => a.y - b.y || a.x - b.x);
  for (const group of chants) {
    const lines = group.items.map(line => line.trim()).filter(Boolean);
    if (!lines.length) continue;
    const effects = links.filter(link => link.from === group.id).map(link => groupById(link.to)).filter(Boolean).sort((a, b) => a.y - b.y || a.x - b.x);
    if (!effects.length) { lonely.push(lines[0]); continue; }
    // 名前がなければ さいしょの詠唱を名前にする。同じ名前は (2) をつける
    let name = (group.name || "").trim() || lines[0];
    for (let number = 2; usedNames.has(name); number++) name = `${(group.name || "").trim() || lines[0]}(${number})`;
    usedNames.add(name);
    out.push(`[${name}]`, ...lines);
    for (const effect of effects) out.push(...pieceLines(effect.items));
    out.push("");
  }
  if (lonely.length) out.push(`# 効果につながっていない詠唱: ${lonely.join("・")}`);
  return out.join("\n");
}

/** 魔法のならび（readText の結果）を 作業台にする。同じ効果は 1つのかたまりにまとめて 線を2本ひく */
function spellsToBoard(spells) {
  groups = []; links = []; nextId = 1; selected = null;
  const byProgram = new Map();
  let y = 20;
  for (const spell of spells) {
    const chant = makeGroup("chant", 20, y, spell.chants.length ? spell.chants : [""], spell.name);
    let height = chantHeight(chant);
    if (spell.pieces.length) {
      const key = pieceLines(spell.pieces).join("\n");
      let effect = byProgram.get(key);
      if (!effect) {
        effect = makeGroup("effect", 420, y, spell.pieces);
        byProgram.set(key, effect);
        height = Math.max(height, effectHeight(effect));
      }
      links.push({ from: chant.id, to: effect.id });
    }
    y += height + GRIP + 40;
  }
}

// ================= 画面を作る =================
const $ = id => document.getElementById(id);
const SVG_NS = "http://www.w3.org/2000/svg";

/** 作業台を ぜんぶ描く */
function drawBoard() {
  const board = $("board");
  board.replaceChildren();
  // 線は いちばん下に
  const wires = document.createElementNS(SVG_NS, "svg");
  wires.id = "wires";
  wires.setAttribute("width", "1");
  wires.setAttribute("height", "1");
  board.append(wires);
  for (const group of groups) board.append(group.kind === "chant" ? drawChantGroup(group) : drawEffectGroup(group));
  drawWires();
}

/** 線を描きなおす（かたまりを動かしたときも） */
function drawWires(extra) {
  const wires = $("wires");
  if (!wires) return;
  wires.replaceChildren();
  const curve = (from, to) => {
    const bend = Math.max(40, Math.abs(to.x - from.x) / 2);
    return `M ${from.x} ${from.y} C ${from.x + bend} ${from.y}, ${to.x - bend} ${to.y}, ${to.x} ${to.y}`;
  };
  for (const link of links) {
    const from = groupById(link.from), to = groupById(link.to);
    if (!from || !to) continue;
    const d = curve(portOut(from), portIn(to));
    // 押しやすいように 太い とうめいの線を下にしく
    const hit = document.createElementNS(SVG_NS, "path");
    hit.setAttribute("d", d);
    hit.setAttribute("class", "wire-hit");
    const title = document.createElementNS(SVG_NS, "title");
    title.textContent = "押すと この線を消す";
    hit.append(title);
    hit.addEventListener("click", () => { links = links.filter(item => item !== link); drawWires(); save(); });
    const line = document.createElementNS(SVG_NS, "path");
    line.setAttribute("d", d);
    line.setAttribute("class", "wire");
    wires.append(line, hit);
  }
  // ひいている とちゅうの線
  if (extra) {
    const line = document.createElementNS(SVG_NS, "path");
    line.setAttribute("d", curve(extra.from, extra.to));
    line.setAttribute("class", "wire drawing");
    wires.append(line);
  }
}

/** かたまりの入れもの（上に つかんで動かすところ） */
function groupShell(group, label, width) {
  const root = document.createElement("div");
  root.className = `group ${group.kind}`;
  root.dataset.id = group.id;
  root.style.left = `${group.x}px`;
  root.style.top = `${group.y}px`;
  root.style.width = `${width}px`;
  const grip = document.createElement("div");
  grip.className = "grip";
  grip.textContent = "⠿";
  grip.setAttribute("aria-label", `${label}のかたまりを動かす`);
  grip.title = "つかんで動かす（同じ種類のかたまりの上で はなすと くっつく）";
  root.append(grip);
  moveSetup(grip, root, group);
  // ここ（ピースのないところ）に落とすと、さいごに入る
  root.addEventListener("dragover", event => event.preventDefault());
  root.addEventListener("drop", event => {
    event.preventDefault();
    event.stopPropagation();
    const data = event.dataTransfer.getData("text/plain");
    if (group.kind === "chant") dropChant(data, group, group.items.length);
    else dropEffect(data, group, group.items.length);
  });
  return root;
}

/** 詠唱のかたまりを描く（名前 ▶ 詠唱の列 ▶ 線の出るところ） */
function drawChantGroup(group) {
  const height = chantHeight(group);
  const root = groupShell(group, "詠唱", SIZE.nameW + SIZE.chantW + 30);
  root.style.height = `${GRIP + height}px`;
  const rows = Math.max(group.items.length, 1);

  // 名前のピース（右に出っぱり）。詠唱の列の まんなかの高さに置く。名前はなくてもいい
  const name = makeJig(0, GRIP + (rows - 1) * SIZE.h / 2, SIZE.nameW, SIZE.h, ["flat", "tab", "flat", "flat"], "name");
  name.body.append(titleSpan("名前"));
  const nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.value = group.name || "";
  nameInput.placeholder = "なくてOK";
  nameInput.setAttribute("aria-label", "魔法の名前");
  nameInput.addEventListener("input", () => { group.name = nameInput.value; save(); });
  name.body.append(nameInput);
  // ✕ で この詠唱のかたまりを消す（1回目は確認、2回目で消す）
  const del = closeButton("この詠唱のかたまりを消す", () => {
    if (del.dataset.sure !== "1") { del.dataset.sure = "1"; del.textContent = "もう一度で消す"; setTimeout(() => { del.dataset.sure = ""; del.textContent = "✕"; }, 3000); return; }
    removeGroup(group.id);
    drawBoard(); save();
  });
  name.root.append(del);
  root.append(name.root);

  // 詠唱のピース（上に出っぱり・下にへこみ・左にへこみ・右に出っぱり）
  group.items.forEach((line, index) => {
    const jig = makeJig(SIZE.nameW, GRIP + index * SIZE.h, SIZE.chantW, SIZE.h, ["tab", "tab", "hole", "hole"], "chant");
    jig.body.append(titleSpan("詠唱"));
    const input = document.createElement("input");
    input.type = "text";
    input.dataset.chant = `${group.id}-${index}`;
    input.value = line;
    input.placeholder = "言うことを書く";
    input.setAttribute("aria-label", `${index + 1}番目の詠唱`);
    input.addEventListener("input", () => { group.items[index] = input.value; save(); });
    input.addEventListener("focus", () => choose(group.id, index, jig.root));
    jig.body.append(input);
    jig.root.append(closeButton(`${index + 1}番目の詠唱を消す`, () => { group.items.splice(index, 1); selected = null; drawBoard(); save(); }));
    jig.root.addEventListener("click", () => choose(group.id, index, jig.root));
    if (isSelected(group.id, index)) jig.root.classList.add("selected");
    dragSetup(jig.root, `chant:${group.id}:${index}`, data => dropChant(data, group, index));
    root.append(jig.root);
  });

  // 線の出るところ（ここから 効果のかたまりへ ひっぱる）
  const out = portOut(group);
  const port = document.createElement("div");
  port.className = "port out";
  port.style.left = `${out.x - group.x}px`;
  port.style.top = `${out.y - group.y}px`;
  port.title = "ひっぱって 効果のかたまりに つなぐ";
  wireSetup(port, group);
  root.append(port);
  return root;
}

/** 効果のかたまりを描く（種類や数字は ピースの上で変える） */
function drawEffectGroup(group) {
  let depth = 0, maxDepth = 0, y = GRIP;
  const root = groupShell(group, "効果", SIZE.effectW + 60);
  group.items.forEach((piece, index) => {
    if (piece.part === "ここまで") depth = Math.max(0, depth - 1);
    const spec = SPEC[piece.part];
    const height = pieceHeight(piece);
    const jig = makeJig(depth * 18, y, SIZE.effectW, height, ["tab", "tab", "hole", "hole"], spec.cat);
    y += height;
    if (depth > 0) { const loop = document.createElement("span"); loop.className = "loop"; jig.root.append(loop); }
    if (piece.part === "くりかえす") depth++;
    maxDepth = Math.max(maxDepth, depth);
    jig.body.append(kindSelect(group, piece, index));
    if (spec.args.length) jig.body.append(argControls(piece));
    if (isSelected(group.id, index)) jig.root.classList.add("selected");
    jig.root.tabIndex = 0;
    jig.root.setAttribute("aria-label", `${index + 1}番目の効果 ${piece.part}`);
    // 押すと えらぶ（ピース箱の「効果」が このすぐ下につながる）
    jig.root.addEventListener("click", () => choose(group.id, index, jig.root));
    // ✕ で消す・⧉ でふやす
    jig.root.append(closeButton(`${index + 1}番目の効果を消す`, () => { group.items.splice(index, 1); selected = null; cleanEmpty(); drawBoard(); save(); }));
    const copy = closeButton(`${index + 1}番目の効果をふやす`, () => { group.items.splice(index + 1, 0, structuredClone(piece)); selected = { group: group.id, index: index + 1 }; drawBoard(); save(); });
    copy.textContent = "⧉";
    copy.classList.add("copy");
    jig.root.append(copy);
    dragSetup(jig.root, `move:${group.id}:${index}`, data => dropEffect(data, group, index));
    root.append(jig.root);
  });
  root.style.width = `${SIZE.effectW + maxDepth * 18 + 12}px`;
  root.style.height = `${y + 10}px`;

  // 線の入るところ
  const port = document.createElement("div");
  port.className = "port in";
  port.style.left = `${portIn(group).x - group.x}px`;
  port.style.top = `${portIn(group).y - group.y}px`;
  port.title = "詠唱のかたまりから ここへ線をつなぐ";
  root.append(port);
  return root;
}

/** えらんでいるか */
function isSelected(groupId, index) {
  return selected?.group === groupId && selected.index === index;
}

/** ピースを えらぶ（描きなおさず、しるしだけ つけかえる） */
function choose(groupId, index, element) {
  selected = { group: groupId, index };
  document.querySelectorAll(".jig.selected").forEach(jig => jig.classList.remove("selected"));
  element.classList.add("selected");
}

/** 効果ピースの いちばん上：種類をえらぶ（えらびなおすと 同じ名前の設定は引きつぐ） */
function kindSelect(group, piece, index) {
  const select = document.createElement("select");
  select.className = "kind";
  select.setAttribute("aria-label", `${index + 1}番目の効果の種類`);
  for (const name of [...new Set(PIECES.map(item => item.group))]) {
    const box = document.createElement("optgroup");
    box.label = name;
    for (const item of PIECES.filter(entry => entry.group === name)) box.append(new Option(item.part, item.part));
    select.append(box);
  }
  select.value = piece.part;
  select.addEventListener("change", () => {
    const fresh = newPiece(select.value);
    for (const name of Object.keys(fresh.args)) if (name in piece.args) fresh.args[name] = piece.args[name];
    group.items[index] = fresh;
    // くりかえす には ここまで を すぐ下につける
    if (select.value === "くりかえす") group.items.splice(index + 1, 0, newPiece("ここまで"));
    selected = { group: group.id, index };
    drawBoard(); save();
  });
  return select;
}

// ================= 動かす・つなぐ =================
/** 画面の場所を 作業台の上の場所にする（ずらしと大きさを もどす） */
function toBoard(clientX, clientY) {
  const rect = $("boardBox").getBoundingClientRect();
  return { x: (clientX - rect.left - view.x) / view.zoom, y: (clientY - rect.top - view.y) / view.zoom };
}

/** かたまり from を into の下に くっつける（線も 引きつぐ） */
function mergeGroups(into, from) {
  into.items.push(...from.items);
  for (const link of links) {
    if (link.from === from.id) link.from = into.id;
    if (link.to === from.id) link.to = into.id;
  }
  // 同じ線が2本になったら 1本に
  const seen = new Set();
  links = links.filter(link => { const key = `${link.from}-${link.to}`; if (seen.has(key)) return false; seen.add(key); return true; });
  removeGroup(from.id);
}

/** つかむところを ひっぱると、かたまりごと動く */
function moveSetup(grip, root, group) {
  grip.addEventListener("pointerdown", event => {
    if (event.button !== 0) return;
    event.preventDefault();
    const start = toBoard(event.clientX, event.clientY);
    const from = { x: group.x, y: group.y };
    grip.setPointerCapture(event.pointerId);
    root.classList.add("moving");
    const onMove = moveEvent => {
      const now = toBoard(moveEvent.clientX, moveEvent.clientY);
      group.x = Math.round(from.x + now.x - start.x);
      group.y = Math.round(from.y + now.y - start.y);
      root.style.left = `${group.x}px`;
      root.style.top = `${group.y}px`;
      drawWires();
    };
    const onUp = upEvent => {
      grip.removeEventListener("pointermove", onMove);
      grip.removeEventListener("pointerup", onUp);
      root.classList.remove("moving");
      // 同じ種類のかたまりの上で はなしたら、その下に くっつける
      root.style.pointerEvents = "none";
      const target = document.elementFromPoint(upEvent.clientX, upEvent.clientY)?.closest(`.group.${group.kind}`);
      root.style.pointerEvents = "";
      const other = target && groupById(Number(target.dataset.id));
      if (other && other !== group) {
        mergeGroups(other, group);
        drawBoard();
      }
      save();
    };
    grip.addEventListener("pointermove", onMove);
    grip.addEventListener("pointerup", onUp);
  });
}

/** 線の出るところを ひっぱって、効果のかたまりの上で はなすと つながる */
function wireSetup(port, group) {
  port.addEventListener("pointerdown", event => {
    if (event.button !== 0) return;
    event.preventDefault();
    event.stopPropagation();
    port.setPointerCapture(event.pointerId);
    const onMove = moveEvent => drawWires({ from: portOut(group), to: toBoard(moveEvent.clientX, moveEvent.clientY) });
    const onUp = upEvent => {
      port.removeEventListener("pointermove", onMove);
      port.removeEventListener("pointerup", onUp);
      const target = document.elementFromPoint(upEvent.clientX, upEvent.clientY)?.closest(".group.effect");
      if (target) {
        const to = Number(target.dataset.id);
        if (!links.some(link => link.from === group.id && link.to === to)) links.push({ from: group.id, to });
        save();
      }
      drawWires();
    };
    port.addEventListener("pointermove", onMove);
    port.addEventListener("pointerup", onUp);
  });
}

/** 詠唱ピースを かたまり group の index の前へ入れる（ほかのかたまりからでも、ピース箱からでも） */
function dropChant(data, group, index) {
  let line = "", to = index;
  if (data === "new:詠唱") {
    // ピース箱からの 新しい詠唱
  } else if (data.startsWith("chant:")) {
    const [fromId, from] = data.slice(6).split(":").map(Number);
    const source = groupById(fromId);
    [line] = source.items.splice(from, 1);
    to = source === group && from < index ? index - 1 : index;
  } else {
    return;
  }
  group.items.splice(to, 0, line);
  selected = { group: group.id, index: to };
  drawBoard(); save();
}

/** 効果ピースを かたまり group の index の前へ入れる（ほかのかたまりからでも、ピース箱からでも） */
function dropEffect(data, group, index) {
  let to = index;
  if (data.startsWith("move:")) {
    const [fromId, from] = data.slice(5).split(":").map(Number);
    const source = groupById(fromId);
    const [piece] = source.items.splice(from, 1);
    to = source === group && from < index ? index - 1 : index;
    group.items.splice(to, 0, piece);
  } else if (data === "new:効果") {
    group.items.splice(index, 0, newPiece(FIRST_EFFECT));
  } else {
    return;
  }
  selected = { group: group.id, index: to };
  cleanEmpty();
  drawBoard(); save();
}

/** 作業台の 何もないところに落とすと、そこに新しいかたまりができる */
function dropOnEmpty(data, point) {
  if (data === "new:名前" || data === "new:詠唱") {
    const group = makeGroup("chant", point.x, point.y, [""]);
    selected = { group: group.id, index: 0 };
  } else if (data === "new:効果") {
    const group = makeGroup("effect", point.x, point.y, [newPiece(FIRST_EFFECT)]);
    selected = { group: group.id, index: 0 };
  } else if (data.startsWith("chant:")) {
    const [fromId, from] = data.slice(6).split(":").map(Number);
    const [line] = groupById(fromId).items.splice(from, 1);
    const group = makeGroup("chant", point.x, point.y, [line]);
    selected = { group: group.id, index: 0 };
  } else if (data.startsWith("move:")) {
    const [fromId, from] = data.slice(5).split(":").map(Number);
    const [piece] = groupById(fromId).items.splice(from, 1);
    const group = makeGroup("effect", point.x, point.y, [piece]);
    selected = { group: group.id, index: 0 };
    cleanEmpty();
  } else {
    return;
  }
  drawBoard(); save();
}

// ================= 見かた（大きさ・移動） =================
const view = { x: 0, y: 0, zoom: 1 };

/** 作業台の見かたを 画面にあてる */
function applyView() {
  $("board").style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.zoom})`;
  $("zoomText").textContent = `${Math.round(view.zoom * 100)}%`;
}

/** 新しいかたまりを置く 空いている所（いちばん下のかたまりの さらに下）。見えなければ そこまで動かす */
function viewCenter() {
  let bottom = 20;
  for (const group of groups) {
    const height = group.kind === "chant" ? chantHeight(group) : effectHeight(group);
    bottom = Math.max(bottom, group.y + GRIP + height + 40);
  }
  const point = { x: 20, y: bottom };
  // 見えるところまで 作業台を動かす
  const box = $("boardBox");
  const screenY = point.y * view.zoom + view.y;
  if (screenY < 0 || screenY > box.clientHeight - 120) view.y = box.clientHeight * 0.4 - point.y * view.zoom;
  const screenX = point.x * view.zoom + view.x;
  if (screenX < 0 || screenX > box.clientWidth - 200) view.x = 20 - point.x * view.zoom;
  applyView();
  return point;
}

/** Ctrl＋ホイールで大きさ、ホイールだけで上下（Shift で左右）、ホイールを押してドラッグで移動 */
function setupView() {
  const box = $("boardBox");
  box.addEventListener("wheel", event => {
    event.preventDefault();
    if (event.ctrlKey) {
      // マウスのある所を中心に 大きく・小さく
      const rect = box.getBoundingClientRect();
      const mouseX = event.clientX - rect.left, mouseY = event.clientY - rect.top;
      const zoom = Math.min(2.5, Math.max(0.25, view.zoom * Math.exp(-event.deltaY * 0.0015)));
      view.x = mouseX - (mouseX - view.x) * (zoom / view.zoom);
      view.y = mouseY - (mouseY - view.y) * (zoom / view.zoom);
      view.zoom = zoom;
    } else if (event.shiftKey) {
      view.x -= event.deltaY;
    } else {
      view.x -= event.deltaX;
      view.y -= event.deltaY;
    }
    applyView();
  }, { passive: false });

  // ホイールを押したまま 動かすと、作業台ごと動く
  let drag = null;
  box.addEventListener("pointerdown", event => {
    if (event.button !== 1) return;
    event.preventDefault();
    drag = { startX: event.clientX, startY: event.clientY, x: view.x, y: view.y };
    box.setPointerCapture(event.pointerId);
    box.classList.add("panning");
  });
  box.addEventListener("pointermove", event => {
    if (!drag) return;
    view.x = drag.x + event.clientX - drag.startX;
    view.y = drag.y + event.clientY - drag.startY;
    applyView();
  });
  const stop = () => { drag = null; box.classList.remove("panning"); };
  box.addEventListener("pointerup", stop);
  box.addEventListener("pointercancel", stop);
  // ホイールを押したときの 自動スクロールを出さない
  box.addEventListener("mousedown", event => { if (event.button === 1) event.preventDefault(); });
  // 何もないところに ピースを落とす
  box.addEventListener("dragover", event => event.preventDefault());
  box.addEventListener("drop", event => {
    event.preventDefault();
    dropOnEmpty(event.dataTransfer.getData("text/plain"), toBoard(event.clientX, event.clientY));
  });
  $("resetView").addEventListener("click", () => { view.x = 0; view.y = 0; view.zoom = 1; applyView(); });
}

// ================= ピース箱 =================
/** ピース箱を描く（名前・詠唱・効果の3つだけ） */
function drawShelf() {
  const shelf = $("shelf");
  const row = document.createElement("div");
  row.className = "row";
  const kinds = [
    { label: "名前", cat: "name", help: "新しい詠唱のかたまりを つくる", sides: ["flat", "tab", "flat", "flat"], add: addChantGroup },
    { label: "詠唱", cat: "chant", help: "えらんでいる詠唱のすぐ下に ふやす", sides: ["tab", "tab", "hole", "hole"], add: addChantPiece },
    { label: "効果", cat: "attack", help: "えらんでいる効果のすぐ下に つなぐ。詠唱をえらんでいたら 新しい効果のかたまりを作って線でつなぐ", sides: ["tab", "tab", "hole", "hole"], add: addEffectPiece },
  ];
  for (const kind of kinds) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "shelf-piece";
    button.style.setProperty("--c", `var(--c-${kind.cat})`);
    const label = document.createElement("span");
    label.textContent = kind.label;
    button.append(label);
    // 文字の大きさが決まってから、形を描く
    const drawShape = () => { button.querySelector("svg")?.remove(); button.prepend(shapeSvg(button.offsetWidth, button.offsetHeight, kind.sides)); };
    (document.fonts?.ready ?? Promise.resolve()).then(() => requestAnimationFrame(drawShape));
    button.title = kind.help;
    button.draggable = true;
    button.addEventListener("dragstart", event => event.dataTransfer.setData("text/plain", `new:${kind.label}`));
    button.addEventListener("click", kind.add);
    row.append(button);
  }
  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = "押すと えらんでいるピースのすぐ下に入ります。作業台の あいている所へドラッグすると 新しいかたまりに。ピースを 同じ種類のピースの上へドラッグすると くっつきます。";
  shelf.append(row, hint);
}

/** 新しい詠唱のかたまりを作る */
function addChantGroup() {
  const point = viewCenter();
  const group = makeGroup("chant", point.x, point.y, [""]);
  selected = { group: group.id, index: 0 };
  drawBoard(); save();
  document.querySelector(`[data-chant="${group.id}-0"]`)?.focus({ preventScroll: true });
}

/** 詠唱のかたまりに 詠唱をふやす（えらんでいる詠唱のすぐ下、なければ さいご） */
function addChantTo(group) {
  const at = selected?.group === group.id ? selected.index + 1 : group.items.length;
  group.items.splice(at, 0, "");
  selected = { group: group.id, index: at };
  drawBoard(); save();
  document.querySelector(`[data-chant="${group.id}-${at}"]`)?.focus({ preventScroll: true });
}

/** ピース箱の「詠唱」：えらんでいる詠唱のかたまりへ。なければ 新しいかたまり */
function addChantPiece() {
  const group = groupById(selected?.group);
  if (group?.kind === "chant") addChantTo(group);
  else addChantGroup();
}

/** ピース箱の「効果」：えらんでいる効果のすぐ下へ。詠唱をえらんでいたら 新しい効果のかたまりを作って つなぐ */
function addEffectPiece() {
  const group = groupById(selected?.group);
  if (group?.kind === "effect") {
    const at = selected.index + 1;
    group.items.splice(at, 0, newPiece(FIRST_EFFECT));
    selected = { group: group.id, index: at };
  } else if (group?.kind === "chant") {
    const effect = makeGroup("effect", group.x + SIZE.nameW + SIZE.chantW + 90, group.y, [newPiece(FIRST_EFFECT)]);
    links.push({ from: group.id, to: effect.id });
    selected = { group: effect.id, index: 0 };
  } else {
    const point = viewCenter();
    const effect = makeGroup("effect", point.x + 400, point.y, [newPiece(FIRST_EFFECT)]);
    selected = { group: effect.id, index: 0 };
  }
  drawBoard(); save();
}

// ================= ほぞん =================
/** 右の文を作りなおす */
function refreshText() {
  $("output").value = makeText();
}

/** 変わったら、文を作りなおして このブラウザにとっておく */
function save() {
  refreshText();
  try { localStorage.setItem("koemahou-board", JSON.stringify({ groups, links, nextId })); } catch (error) { /* とっておけなくても動く */ }
}

/** とっておいた作業台を読む（前の形「魔法ごと」のデータなら 作業台にする） */
function load() {
  try {
    const saved = JSON.parse(localStorage.getItem("koemahou-board") || "null");
    if (saved && Array.isArray(saved.groups)) {
      groups = saved.groups; links = saved.links || []; nextId = saved.nextId || groups.length + 1;
      return;
    }
    const old = JSON.parse(localStorage.getItem("koemahou-puzzle") || "null");
    if (Array.isArray(old) && old.length) { spellsToBoard(old); return; }
  } catch (error) { /* 読めなければ 見本から */ }
  spellsToBoard(readText(SAMPLE_TEXT));
}

// ================= ボタン =================
$("copy").addEventListener("click", () => {
  navigator.clipboard.writeText($("output").value).then(
    () => { $("status").textContent = "コピーしました！"; },
    () => { $("output").select(); $("status").textContent = "選んだので Ctrl+C でコピーしてね"; });
});
$("importBtn").addEventListener("click", () => {
  const read = readText($("importText").value);
  if (!read.length) { $("status").textContent = "魔法が見つかりませんでした（[名前] の行がいります）"; return; }
  spellsToBoard(read);
  view.x = 0; view.y = 0; view.zoom = 1; applyView();
  drawBoard(); save();
  $("status").textContent = `魔法を ${read.length} こ 読みこみました`;
});

// ================= はじめる =================
load();
drawShelf();
setupView();
applyView();
drawBoard();
refreshText();
</script>
